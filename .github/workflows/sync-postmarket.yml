name: Sync Post-Market ETF Flows to Cloudflare KV

on:
  schedule:
    # Mon-Sat 08:45, 09:15, 17:30, 21:00 Asia/Shanghai (UTC+8)
    - cron: "45 0 * * 1-6"
    - cron: "15 1 * * 1-6"
    - cron: "30 9 * * 1-6"
    - cron: "0 13 * * 1-6"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback trading days to sync"
        required: false
        default: "85"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore SQLite database cache
        uses: actions/cache@v4
        with:
          path: data/rooftop_etf.db*
          key: etf-sqlite-v1-${{ github.run_id }}
          restore-keys: |
            etf-sqlite-v1-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync post-market ETF flows and regenerate report
        env:
          SYNC_DAYS: ${{ inputs.days || '85' }}
        run: python sync_and_report.py --days "$SYNC_DAYS"

      - name: Check Cloudflare upload mode
        id: cf_check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          ADMIN_TOKEN: ${{ secrets.ROOFTOP_ADMIN_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACC" ] && [ -n "$CF_KV" ]; then
            echo "mode=cf_api" >> "$GITHUB_OUTPUT"
          elif [ -n "$ADMIN_TOKEN" ]; then
            echo "mode=worker_seed" >> "$GITHUB_OUTPUT"
          else
            echo "mode=dry_run" >> "$GITHUB_OUTPUT"
            echo "::notice::Neither CLOUDFLARE_API_TOKEN nor ROOFTOP_ADMIN_TOKEN is configured; dry run only."
          fi

      - name: Export and upload snapshot to Cloudflare KV (Direct API)
        if: steps.cf_check.outputs.mode == 'cf_api'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: python export_cf_snapshot.py --upload-kv --include-assets

      - name: Export and seed snapshot via Worker Admin Endpoint
        if: steps.cf_check.outputs.mode == 'worker_seed'
        env:
          ROOFTOP_ADMIN_TOKEN: ${{ secrets.ROOFTOP_ADMIN_TOKEN }}
        run: |
          python export_cf_snapshot.py --include-assets \
            --seed-url "https://rooftop-etf-flow.rooftop-tools.workers.dev" \
            --admin-token "$ROOFTOP_ADMIN_TOKEN"

      - name: Export local snapshot only (dry run when no upload secret configured)
        if: steps.cf_check.outputs.mode == 'dry_run'
        run: python export_cf_snapshot.py --include-assets
