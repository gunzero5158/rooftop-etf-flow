name: Sync Post-Market ETF Flows to Cloudflare KV

on:
  schedule:
    # Mon-Sat 08:40, 17:30, 21:00 Asia/Shanghai (UTC+8)
    - cron: "40 0 * * 1-6"
    - cron: "30 9 * * 1-6"
    - cron: "0 13 * * 1-6"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback trading days to sync"
        required: false
        default: "30"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore SQLite database cache
        uses: actions/cache@v4
        with:
          path: data/rooftop_etf.db*
          key: etf-sqlite-v1-${{ github.run_id }}
          restore-keys: |
            etf-sqlite-v1-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync post-market ETF flows and regenerate report
        env:
          SYNC_DAYS: ${{ inputs.days || '30' }}
        run: python sync_and_report.py --days "$SYNC_DAYS"

      - name: Check Cloudflare secrets
        id: cf_check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACC" ] || [ -z "$CF_KV" ]; then
            echo "has_cf=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets incomplete; exported local snapshot artifact only."
          else
            echo "has_cf=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Export and upload snapshot to Cloudflare KV
        if: steps.cf_check.outputs.has_cf == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: python export_cf_snapshot.py --upload-kv --include-assets

      - name: Export local snapshot only (dry run when token not configured)
        if: steps.cf_check.outputs.has_cf != 'true'
        run: python export_cf_snapshot.py --include-assets
